name: Daily data update

# Runs twice a day (after morning injury news, and after the 5pm ET reports)
# and can be started by hand from the Actions tab.
# Every step runs even if an earlier one failed, so one broken source does not
# stop the rest; the run still shows red if anything failed.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 21 * * *"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install numpy pdfplumber
      - name: Fetch schedule, injuries and new box scores
        run: python scripts/update_data.py --mode daily
      - name: Fetch official injury reports
        if: always()
        run: python scripts/injury_report.py --mode fetch
      - name: Measure play probabilities
        if: always()
        run: python scripts/injury_report.py --mode calibrate
      - name: Refresh per-minute rates
        if: always()
        run: python scripts/baseline_rates.py --mode estimate
      - name: Refresh minutes projections
        if: always()
        run: python scripts/minutes_model.py --mode project
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
