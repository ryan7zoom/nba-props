name: Daily data update

# Runs twice a day on its own (07:20 and 12:20 UTC = 15:20 and 20:20 GMT+8) and does everything: box scores,
# injuries, projections, sportsbook lines, the Under shortlist and grading. A run you start by hand ("Run workflow")
# does the same and also LOCKS the next slate's picks into data/picks_log.csv. Scheduled runs never lock.
# Sportsbook lines: PropLine is asked per game (the free plan allows 1,000 requests a day). Games whose lines were
# already found are kept in data/lines_cache.json and not asked for again; only games with no lines yet are asked.
# Tick "refresh_lines" when starting a run by hand to ask for every game again.
# Every step runs even if an earlier one failed, so one broken source does not stop the rest;
# the run still shows red if anything failed.
on:
  workflow_dispatch:
    inputs:
      refresh_lines:
        description: "Ask PropLine for every game again (ignore the saved lines)"
        type: boolean
        default: false
  schedule:
    - cron: "20 7 * * *"
    - cron: "20 12 * * *"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install numpy pandas pdfplumber
      - name: Fetch schedule, injuries and new box scores
        run: python scripts/update_data.py --mode daily
      - name: Fetch official injury reports
        if: always()
        run: python scripts/injury_report.py --mode fetch
      - name: Measure play probabilities
        if: always()
        run: python scripts/injury_report.py --mode calibrate
      - name: Refresh per-minute rates
        if: always()
        run: python scripts/baseline_rates.py --mode estimate
      - name: Refresh minutes projections
        if: always()
        run: python scripts/minutes_model.py --mode project
      - name: Update opponent defense
        if: always()
        run: python scripts/defense_effects.py --mode estimate
      - name: Simulate prop distributions
        if: always()
        run: python scripts/simulate_props.py --mode project
      - name: Adjust for missing teammates
        if: always()
        run: python scripts/absence_adjust.py
      - name: Update recent form
        if: always()
        run: python scripts/form.py
      - name: Team context (ratings, form, rest, injuries)
        if: always()
        run: python scripts/team_context.py
      - name: Fetch sportsbook lines
        if: always()
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python scripts/lines.py ${{ inputs.refresh_lines && '--refresh' || '' }}
      - name: Fetch game lines (total, spread)
        if: always()
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python scripts/game_lines.py
      - name: Build team model and game builders
        if: always()
        run: python scripts/game_model.py project
      - name: Build Under shortlist and freeze started games
        if: always()
        run: python scripts/shortlist.py ${{ github.event_name == 'workflow_dispatch' && '--lock' || '' }}
      - name: Grade lines against results
        if: always()
        run: python scripts/grade_lines.py
      - name: Grade the shortlist log
        if: always()
        run: python scripts/shortlist.py --grade
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Daily data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
