name: Smoke test (data sources)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run smoke test
        run: python scripts/smoke_test.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke_results.json
          if-no-files-found: warn
